<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Unit of Payments app icon">
  <title>Unit of Payments — App Icon</title>
  <!-- Paper background baked in: avoids the iOS App Store alpha-channel
       rejection and matches the screen surface the icon sits on. -->
  <rect width="512" height="512" fill="#FAF3F1"/>
  <g id="card-back">
    <rect x="52" y="134" width="320" height="200" rx="18" ry="18" fill="#5B2C6F"/>
  </g>
  <g id="card-mid">
    <rect x="74" y="156" width="320" height="200" rx="18" ry="18" fill="#1E4D6B"/>
  </g>
  <g id="card-front">
    <rect x="96" y="178" width="320" height="200" rx="18" ry="18" fill="#C19A3F"/>
    <g id="chip">
      <rect x="126" y="208" width="48" height="38" rx="5" ry="5" fill="#8B6A2E"/>
      <line x1="126" y1="220" x2="174" y2="220" stroke="#C19A3F" stroke-width="1.2"/>
      <line x1="126" y1="234" x2="174" y2="234" stroke="#C19A3F" stroke-width="1.2"/>
      <line x1="150" y1="208" x2="150" y2="246" stroke="#C19A3F" stroke-width="1.2"/>
    </g>
    <rect x="388" y="208" width="4" height="140" rx="2" ry="2" fill="#1C1411" fill-opacity="0.35"/>
  </g>
</svg>