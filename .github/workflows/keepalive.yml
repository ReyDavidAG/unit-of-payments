name: keepalive

# Free Supabase projects pause after 7 days without database activity.
on:
  schedule:
    - cron: '0 12 */3 * *' # every 3 days, well inside the 7-day window
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        # -f makes the job fail on an HTTP error, so a silent outage still sends mail.
        run: |
          curl -fsS "${SUPABASE_URL}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" > /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
