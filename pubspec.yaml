name: unit_of_payments
description: "Notifies you of upcoming payments and shows all your subscriptions in one place."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.0

dependencies:
  animate_do: ^4.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  # Ships with the SDK, not a third-party package.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  supabase_flutter: ^2.17.1
  table_calendar: ^3.1.2
  timezone: ^0.11.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/icon/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FAF3F1"
  color_dark: "#0A0704"
  image: "lib/assets/icon/splash.png"
  android_12:
    color: "#FAF3F1"
    color_dark: "#0A0704"
    image: "lib/assets/icon/splash_android12.png"
  ios: true
  android: true

flutter:
  uses-material-design: true

  assets:
    - lib/assets/cards/
    - lib/assets/icon/splash.png

  # Bundled, not fetched: the app has to work offline. OFL, see fonts/OFL.txt.
  fonts:
    - family: Geist
      fonts:
        - asset: lib/assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: lib/assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/GeistMono-Medium.ttf
          weight: 500
