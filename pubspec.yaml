name: unit_of_payments
description: "Notifies you of upcoming payments and shows all your subscriptions in one place."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  supabase_flutter: ^2.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled, not fetched: the app has to work offline. OFL, see fonts/OFL.txt.
  fonts:
    - family: Geist
      fonts:
        - asset: lib/assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: lib/assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/GeistMono-Medium.ttf
          weight: 500
